name: Closing Line Capture

on:
  schedule:
    - cron: '*/30 10-22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atm-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Pull state from Supabase
        id: pull
        run: python scripts/state_sync.py pull
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Capture closing lines (Pinnacle)
        run: python scripts/closing_capture.py
        env:
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}

      - name: Record official lineups (API-Football)
        run: python scripts/h_lineups.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}

      - name: Push state to Supabase
        if: ${{ always() && steps.pull.outcome == 'success' }}
        run: python scripts/state_sync.py push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
