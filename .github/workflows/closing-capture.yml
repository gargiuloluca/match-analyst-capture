name: Closing Line Capture

on:
  schedule:
    - cron: '7,37 9-22 * * *'
  workflow_dispatch:

permissions:
  contents: write   # serve solo al commit vuoto anti-sospensione (ultimo passaggio)

concurrency:
  group: atm-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Pull state from Supabase
        id: pull
        run: python scripts/state_sync.py pull
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Capture closing lines (Pinnacle)
        run: python scripts/closing_capture.py
        env:
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}

      - name: Record official lineups (API-Football)
        run: python scripts/h_lineups.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}

      - name: Push state to Supabase
        if: ${{ always() && steps.pull.outcome == 'success' }}
        run: python scripts/state_sync.py push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # GitHub sospende i workflow programmati dopo 60 giorni senza attivita' nella repo.
      # Se l'ultimo commit ha piu' di 45 giorni, ne facciamo uno vuoto (nessun file, nessun dato).
      - name: Keep repository active
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          else
            echo "Repo attiva: nessun commit necessario."
          fi
